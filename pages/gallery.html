<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Project Screenshots | PONGODEV</title>
    <link rel="icon" href="../images/PONGODEV_LOGO_leaf.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <div class="gallery-container">
        <nav class="nav nav-gallery">
            <div class="nav-logo">
                <a href="../index.html"><img src="../images/PONGODEV_LOGO_150h.png" alt="pongodev logo"></a>
            </div>
            <div class="back-link">
                <a href="../index.html#projects">&larr; Back to Projects</a>
            </div>
        </nav>
        <div class="gallery-header">
            <h1 id="gallery-title"></h1>
            <p id="gallery-desc"></p>
            <div class="tag-row" id="gallery-tags"></div>
            <div id="gallery-demo"></div>
        </div>
        <div class="gallery-grid" id="gallery-grid"></div>
    </div>

    <script>
        const PROJECTS = {
            "mh-erp": {
                title: "M&H Food Corporation - iDempiere ERP",
                description: "ERP plugin development, server upgrades (v11 → v13), and Jasper reporting across production environments.",
                tags: ["iDempiere", "Jaspersoft", "Server Admin"],
                folder: "../images/projects/mh-erp",
                count: 4
            },
            "ferrandino": {
                title: "Ferrandino - iDempiere ERP Implementation",
                description: "iDempiere ERP rollout for an Italian cheese manufacturer — raw materials imported, manufacturing and production tracked locally in the Philippines.",
                tags: ["iDempiere", "ERP Implementation", "Manufacturing"],
                folder: "../images/projects/ferrandino",
                count: 2
            },
            "paypiere": {
                title: "Paypiere - Payroll Software",
                description: "Backend development for multi-company payroll processing — Flexible, Semi-Flexible, and Fixed timesheet workflows, with imports from biometric time-in/time-out machines, CSV, and payroll apps.",
                tags: ["Backend", "PostgreSQL"],
                folder: "../images/projects/paypiere",
                count: 3
            },
            "pocket-erp": {
                title: "Pocket ERP",
                description: "Chat-based assistant that simplifies common ERP operations, letting users complete routine tasks without navigating the full iDempiere UI.",
                tags: ["n8n", "Chatbot", "iDempiere"],
                folder: "../images/projects/pocket-erp",
                count: 12
            },
            "rampiere-n8n": {
                title: "Rampiere n8n Automation",
                description: "AI assistant on Mattermost using Claude API & LLM intent routing for business workflows.",
                tags: ["n8n", "Claude API", "Mattermost"],
                folder: "../images/projects/rampiere-n8n",
                count: 2
            },
            "mh-assistant": {
                title: "M&H Food Corporation - MH Assistant",
                description: "Mattermost bot connected to live iDempiere ERP with branch-level access control and attendance reporting.",
                tags: ["Mattermost Bot", "iDempiere", "PostgreSQL"],
                folder: "../images/projects/mh-assistant",
                count: 3
            },
            "heujier": {
                title: "Heujier Sales Script Mobile App",
                description: "Native Android app solving real workflow problem: script lookup and clipboard copying for mobile sales.",
                tags: ["Android", "Kotlin"],
                folder: "../images/projects/heujier",
                count: 3,
                ext: "jpg"
            },
            "gym-crm": {
                title: "Gym CRM by Airtable",
                description: "Gym management system built on Airtable — lead pipeline, member and plan tracking, payments, daily check-in/out logging, and automations that convert leads to members and process payments.",
                tags: ["Airtable", "Automations", "CRM"],
                folder: "../images/projects/gym-crm",
                count: 7,
                demoUrl: "https://www.loom.com/share/744c07ad849845038846397650318892"
            }
        };

        const params = new URLSearchParams(window.location.search);
        const projectId = params.get("project");
        const project = PROJECTS[projectId];
        const grid = document.getElementById("gallery-grid");

        if (project) {
            document.getElementById("page-title").textContent = project.title + " | PONGODEV";
            document.getElementById("gallery-title").textContent = project.title;
            document.getElementById("gallery-desc").textContent = project.description;

            const tagRow = document.getElementById("gallery-tags");
            project.tags.forEach(tag => {
                const span = document.createElement("span");
                span.className = "tag";
                span.textContent = tag;
                tagRow.appendChild(span);
            });

            if (project.demoUrl) {
                const demoContainer = document.getElementById("gallery-demo");
                const loomId = project.demoUrl.split("/share/")[1];

                const wrapper = document.createElement("div");
                wrapper.className = "demo-embed-wrapper";

                const iframe = document.createElement("iframe");
                iframe.src = `https://www.loom.com/embed/${loomId}`;
                iframe.allow = "fullscreen";
                iframe.allowFullscreen = true;
                wrapper.appendChild(iframe);
                demoContainer.appendChild(wrapper);

                const openLink = document.createElement("a");
                openLink.href = project.demoUrl;
                openLink.target = "_blank";
                openLink.className = "demo-open-link";
                openLink.textContent = "Open in Loom ↗";
                demoContainer.appendChild(openLink);
            }

            const ext = project.ext || "png";
            for (let i = 1; i <= project.count; i++) {
                const num = String(i).padStart(2, "0");
                const src = `${project.folder}/${num}.${ext}`;

                const link = document.createElement("a");
                link.href = src;
                link.target = "_blank";

                const img = document.createElement("img");
                img.src = src;
                img.alt = `${project.title} screenshot ${num}`;
                img.loading = "lazy";

                link.appendChild(img);
                grid.appendChild(link);
            }
        } else {
            document.getElementById("gallery-title").textContent = "Project not found";
            document.getElementById("gallery-desc").textContent = "This project's screenshots aren't available yet.";
        }
    </script>
</body>
</html>
